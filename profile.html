<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile | Sai Fitness Gym</title>
    <meta name="description" content="Dedicated profile management page for Sai Fitness Gym members. Update personal stats, emergency contact, and fitness goals.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">

    <script src="js/storage.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/profile.js" defer></script>
</head>
<body class="bg-pale-yellow">

    <!-- Header Navigation -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg site-navbar py-0">
            <div class="container">
                <a href="index.html" class="navbar-brand navbar-brand-logo">
                    <span class="brand-emblem-badge">S</span>
                    <span>SAI FITNESS</span>
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#saiNavbar" aria-controls="saiNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="saiNavbar">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                        <li class="nav-item"><a href="profile.html" class="nav-link active">Profile</a></li>
                        <li class="nav-item"><a href="membership.html" class="nav-link">Membership</a></li>
                        <li class="nav-item"><a href="classes.html" class="nav-link">Classes</a></li>
                    </ul>

                    <div class="d-flex align-items-center gap-2">
                        <a href="dashboard.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Profile Form Section -->
    <section class="section-padding py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-9">
                    
                    <!-- Avatar Header Card -->
                    <div class="card card-luxury p-4 mb-4 text-center">
                        <img src="assets/images/trainer1.jpg" alt="Profile Photo" class="dash-avatar" id="prof-avatar-img">
                        <h2 class="font-heading h3 mb-1" id="prof-display-name">Alexander Wright</h2>
                        <span class="badge badge-gold me-auto ms-auto mb-2" id="prof-display-plan">Performance Member</span>
                        <p class="small text-muted mb-3" id="prof-display-id">ID: MEM-8821</p>
                        <div class="d-flex justify-content-center">
                            <button class="btn btn-outline-primary btn-sm" id="btn-change-photo"><i class="bi bi-camera me-1"></i> Change Photo</button>
                        </div>
                        <input type="file" id="input-photo-file" accept="image/*" class="d-none">
                    </div>

                    <!-- Profile Form Card -->
                    <div class="card card-luxury p-4 p-md-5">
                        <form id="profile-edit-form" novalidate>
                            
                            <h3 class="font-heading h4 text-gold-dark mb-3"><i class="bi bi-person-circle me-1"></i> 1. Personal Information</h3>
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label for="edit-fullname" class="form-label">Full Name</label>
                                    <input type="text" id="edit-fullname" class="form-control" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="edit-email" class="form-label">Email Address</label>
                                    <input type="email" id="edit-email" class="form-control" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-4">
                                    <label for="edit-phone" class="form-label">Phone Number</label>
                                    <input type="tel" id="edit-phone" class="form-control">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="edit-dob" class="form-label">Date of Birth</label>
                                    <input type="date" id="edit-dob" class="form-control">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="edit-gender" class="form-label">Gender</label>
                                    <select id="edit-gender" class="form-select">
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <h3 class="font-heading h4 text-gold-dark mb-3"><i class="bi bi-activity me-1"></i> 2. Fitness Information</h3>
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label for="edit-height" class="form-label">Height (cm)</label>
                                    <input type="text" id="edit-height" class="form-control" placeholder="e.g. 182 cm">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="edit-weight" class="form-label">Weight (kg)</label>
                                    <input type="text" id="edit-weight" class="form-control" placeholder="e.g. 78 kg">
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-8">
                                    <label for="edit-goal" class="form-label">Fitness Goal</label>
                                    <input type="text" id="edit-goal" class="form-control" placeholder="e.g. Hypertrophy & Athletic Endurance">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="edit-exp" class="form-label">Experience Level</label>
                                    <select id="edit-exp" class="form-select">
                                        <option value="Beginner">Beginner</option>
                                        <option value="Intermediate">Intermediate</option>
                                        <option value="Advanced">Advanced</option>
                                    </select>
                                </div>
                            </div>

                            <h3 class="font-heading h4 text-gold-dark mb-3"><i class="bi bi-telephone-plus me-1"></i> 3. Emergency Contact</h3>
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-6">
                                    <label for="edit-emerg-name" class="form-label">Contact Person Name</label>
                                    <input type="text" id="edit-emerg-name" class="form-control" placeholder="e.g. Victoria Wright">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="edit-emerg-phone" class="form-label">Contact Phone</label>
                                    <input type="tel" id="edit-emerg-phone" class="form-control" placeholder="e.g. +1 (555) 987-6543">
                                </div>
                            </div>

                            <div class="d-flex gap-3 justify-content-end">
                                <a href="dashboard.html" class="btn btn-outline-primary">Cancel</a>
                                <button type="submit" class="btn btn-gold">Save Profile Changes</button>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer py-4">
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 Sai Fitness Gym. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
