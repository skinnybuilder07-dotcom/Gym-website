<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Sai Fitness Gym</title>
    <meta name="description" content="Apply for membership at Sai Fitness Gym. Experience exclusive private athletic facilities and bespoke master coaching.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">

    <script src="js/storage.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body class="bg-pale-yellow">

    <!-- Header Navigation -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg site-navbar py-0">
            <div class="container">
                <a href="index.html" class="navbar-brand navbar-brand-logo">
                    <span class="brand-emblem-badge">S</span>
                    <span>SAI FITNESS</span>
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#saiNavbar" aria-controls="saiNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="saiNavbar">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                        <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                        <li class="nav-item"><a href="membership.html" class="nav-link">Membership</a></li>
                        <li class="nav-item"><a href="trainers.html" class="nav-link">Trainers</a></li>
                        <li class="nav-item"><a href="classes.html" class="nav-link">Classes</a></li>
                        <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
                    </ul>

                    <div class="d-flex align-items-center gap-2">
                        <a href="login.html" class="btn btn-outline-primary btn-sm">Login</a>
                        <a href="register.html" class="btn btn-primary btn-sm active">Join</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Register Section -->
    <section class="section-padding py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="card card-luxury p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="section-label">MEMBERSHIP APPLICATION</span>
                            <h2 class="font-heading h3">Become a Member</h2>
                            <p class="text-muted small">Complete the form below to register your membership.</p>
                        </div>

                        <form id="register-form" novalidate>
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label for="reg-fullname" class="form-label">Full Name</label>
                                    <input type="text" id="reg-fullname" class="form-control" placeholder="Alexander Wright" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="reg-email" class="form-label">Email Address</label>
                                    <input type="email" id="reg-email" class="form-control" placeholder="alexander@example.com" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label for="reg-phone" class="form-label">Phone Number</label>
                                    <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 234-5678" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="reg-dob" class="form-label">Date of Birth</label>
                                    <input type="date" id="reg-dob" class="form-control" value="1995-06-20" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label for="reg-password" class="form-label">Password</label>
                                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="reg-confirm" class="form-label">Confirm Password</label>
                                    <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-6">
                                    <label for="reg-gender" class="form-label">Gender</label>
                                    <select id="reg-gender" class="form-select">
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Prefer not to say">Prefer not to say</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="reg-plan" class="form-label">Select Membership Plan</label>
                                    <select id="reg-plan" class="form-select">
                                        <option value="Essential">Essential ($120/mo)</option>
                                        <option value="Performance" selected>Performance ($220/mo)</option>
                                        <option value="Elite">Elite ($380/mo)</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-gold w-100 py-3 mb-3">Complete Registration</button>
                        </form>

                        <div class="text-center">
                            <p class="small text-muted m-0">Already registered? <a href="login.html" class="text-gold-dark fw-bold">Sign In Here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer py-4">
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 Sai Fitness Gym. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
